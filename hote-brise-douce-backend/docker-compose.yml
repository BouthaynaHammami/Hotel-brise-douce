     - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
     - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/nettoyage_maintenance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&max_allowed_packet=15728640
     - SPRING_DATASOURCE_USERNAME=root
