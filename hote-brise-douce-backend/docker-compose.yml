services:

 config-server:
   build: ./ServerConfig
   image: hbouthayna/configserver:1.0
   container_name: ServerConfig
   ports:
     - "8888:8888"
   depends_on:
     eureka-server:
       condition: service_healthy
   environment:
     - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
   healthcheck:
    test: [ "CMD", "curl", "-f", "http://config-server:8888/actuator/health" ]
    interval: 10s
    timeout: 5s
    retries: 5

 avis_reclamations:
   build: ./Gestion_avis_reclamations
   image: hbouthayna/avis_reclamations:1.0
   container_name: avis_reclamations
   ports:
    - "8082:8082"
   depends_on:
     mysqldb:
       condition: service_healthy
     config-server:
       condition: service_healthy
     eureka-server:
       condition: service_healthy
     rabbitmq:
       condition: service_healthy
   environment:
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/avis_reclamations?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&max_allowed_packet=15728640
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

 chambres:
   build: ./Gestion_chambres
   image: hbouthayna/chambres:1.0
   container_name: chambres
   ports:
      - "8083:8083"
   depends_on:
     mysqldb:
       condition: service_healthy
     config-server:
       condition: service_healthy
     eureka-server:
       condition: service_healthy
   environment:
     - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-server:8761/eureka/
     - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
     - SPRING_CONFIG_IMPORT=optional:configserver:http://config-server:8888
     - SPRING_DATASOURCE_URL=jdbc:mysql://mysqldb:3306/chambres?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&max_allowed_packet=15728640
     - SPRING_DATASOURCE_USERNAME=root
     - SPRING_DATASOURCE_PASSWORD=root

 clients:
   build: ./Gestion_clients
   image: hbouthayna/clients:1.0
   container_name: clients
   ports:
     - "8084:8084"
   depends_on:
     mysqldb:
       condition: service_healthy
     config-server:
       condition: service_healthy
     eureka-server:
       condition: service_healthy
     rabbitmq:
