# ──────────────────────────────────────────────────────────
# GESTION UTILISATEURS SERVICE (FastAPI) - CONFIGURATION
# ──────────────────────────────────────────────────────────

# Application Identification
spring.application.name=UTILISATEURS-SERVICE

# Server Settings
server.port=8000

# Eureka Registration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=utilisateurs-service
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# API Gateway & Routing
server.servlet.context-path=/utilisateurs/api

# CORS Configuration
server.servlet.cors.allowed-origins=http://localhost:4200
server.servlet.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
server.servlet.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
server.servlet.cors.exposed-headers=Authorization,Content-Type
server.servlet.cors.allow-credentials=true

# JWT Configuration
jwt.secret=your-secret-key-here
jwt.expiration=86400000

# Keycloak Integration
keycloak.auth-server-url=http://keycloak:8080/
keycloak.realm=Hotel_Realm
keycloak.resource=utilisateurs-service
keycloak.public-client=true

# Logging
logging.level.root=INFO
logging.level.com.brise.utilisateurs=DEBUG

# Error Handling
server.error.include-message=always
server.error.include-stacktrace=always

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
