# ──────────────────────────────────────────────────────────
# GESTION PERSONNEL SERVICE - CONFIGURATION
# ──────────────────────────────────────────────────────────

# Application Identification
spring.application.name=personnel-service
server.port=8086

# Database Configuration
spring.datasource.url=jdbc:mysql://mysqldb:3306/personnel?createDatabaseIfNotExist=true&useSSL=false&max_allowed_packet=15728640&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Eureka Registration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Server Settings
server.error.include-message=always
server.error.include-stacktrace=always
server.servlet.context-path=/personnel/api

# Logging Configuration
logging.level.feign=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.com.netflix.discovery=DEBUG
logging.level.com.netflix.loadbalancer=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Welcome Message
welcome.message=Welcome to Gestion Personnel

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
