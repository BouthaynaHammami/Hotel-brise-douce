# ──────────────────────────────────────────────────────────
# GESTION CHAMBRES SERVICE - CONFIGURATION
# ──────────────────────────────────────────────────────────

# Application Identification
spring.application.name=chambres-service
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mysql://mysqldb:3306/chambres?createDatabaseIfNotExist=true&useSSL=false&max_allowed_packet=15728640&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Eureka Registration
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Server Settings
server.error.include-message=always
server.error.include-stacktrace=always
server.servlet.context-path=/chambres/api

