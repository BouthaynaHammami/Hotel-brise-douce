# ──────────────────────────────────────────────────────────
# API GATEWAY - CONFIGURATION CENTRALISÉE
# ──────────────────────────────────────────────────────────


# Application Identification
spring.application.name=api-gateway
server.port=8081
welcome.message=Welcome to API Gateway

# Discovery & Eureka Configuration
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=api-gateway

# Security - JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/Hotel_Realm

# CORS Configuration (Global for Angular Frontend)
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,Accept,X-Requested-With,X-User-Email
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# Load Balancer Settings
spring.cloud.loadbalancer.eureka.enabled=true
spring.cloud.loadbalancer.cache.enabled=false

# Deduplication of CORS Headers
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Headers Access-Control-Allow-Methods

# Logging Configuration
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty.http.client=DEBUG

# ──────────────────────────────────────────────────────────
# GATEWAY ROUTES - SERVICE ROUTING CONFIGURATION
# ──────────────────────────────────────────────────────────

# Route 0: Avis & Réclamations Service
spring.cloud.gateway.routes[0].id=avis_reclamations_service
spring.cloud.gateway.routes[0].uri=lb://avis-reclamations-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/avis_reclamations/api/**

# Route 1: Chambres Service
spring.cloud.gateway.routes[1].id=chambres_service
spring.cloud.gateway.routes[1].uri=lb://chambres-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/chambres/api/**

# Route 2: Clients Service
spring.cloud.gateway.routes[2].id=clients_service
spring.cloud.gateway.routes[2].uri=lb://clients-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/clients/api/**

# Route 3: Nettoyage & Maintenance Service
spring.cloud.gateway.routes[3].id=nettoyage_maintenance_service
spring.cloud.gateway.routes[3].uri=lb://nettoyage-maintenance-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/nettoyage_maintenance/api/**

# Route 4: Personnel Service (NO StripPrefix - service has context-path=/personnel/api)
spring.cloud.gateway.routes[4].id=personnel_service
spring.cloud.gateway.routes[4].uri=lb://personnel-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/personnel/api/**
# Do NOT apply StripPrefix to this route - keep full path as service requires /personnel/api prefix

# Route 5: Réservations Service
spring.cloud.gateway.routes[5].id=reservations_service
spring.cloud.gateway.routes[5].uri=lb://reservations-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/reservations/api/**

# Route 6: Utilisateurs Service (FastAPI - StripPrefix to remove /utilisateurs/api from path)
spring.cloud.gateway.routes[6].id=utilisateurs-service
spring.cloud.gateway.routes[6].uri=lb://utilisateurs-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/utilisateurs/api/**
spring.cloud.gateway.routes[6].filters[0]=StripPrefix=2

# Config Server & Actuator Configuration
spring.cloud.config.enabled=true
management.endpoints.web.exposure.include=*

# Error Handling
server.error.include-message=always
