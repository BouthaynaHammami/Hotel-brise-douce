spring.application.name=chambres-service

spring.datasource.url=jdbc:mysql://localhost:3306/chambres?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.cloud.config.enabled=true
spring.config.import=optional:configserver:http://localhost:8888

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

server.error.include-message=always
server.error.include-stacktrace=always

server.servlet.context-path=/chambres/api

# Physical naming strategy ensure camelCase to snake_case mapping is correct for the DB columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

