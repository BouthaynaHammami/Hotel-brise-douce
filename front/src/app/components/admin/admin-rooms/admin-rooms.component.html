<div class="flex justify-between items-center mb-6">
    <div class="flex gap-3">
        <button class="px-3 py-1.5 rounded text-sm bg-blue-100 text-blue-700">Toutes</button>
        <button class="px-3 py-1.5 rounded text-sm text-gray-500 hover:bg-gray-100">Disponibles</button>
        <button class="px-3 py-1.5 rounded text-sm text-gray-500 hover:bg-gray-100">Occupées</button>
        <button class="px-3 py-1.5 rounded text-sm text-gray-500 hover:bg-gray-100">Maintenance</button>
    </div>
    <button class="btn-primary px-4 py-2 rounded text-sm">+ Ajouter chambre</button>
</div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div *ngFor="let r of rooms" class="card p-4 border-l-4" [ngClass]="r.border">
        <p class="font-bold" style="color:var(--navy)">{{ r.num }}</p>
        <p class="text-xs text-gray-500 mt-1">{{ r.type }}</p>
        <span [ngClass]="r.badge" class="px-2 py-0.5 rounded-full text-xs mt-2 inline-block">{{ r.status }}</span>
    </div>
</div>
