<div class="flex justify-between items-center mb-6">
    <input [(ngModel)]="search" type="text" placeholder="Rechercher un client…"
        class="border border-gray-200 rounded-lg px-4 py-2 text-sm w-72 focus:outline-none focus:border-blue-400" />
    <button class="btn-primary px-4 py-2 rounded text-sm">+ Nouveau client</button>
</div>
<div class="card overflow-hidden">
    <table class="w-full text-sm">
        <thead>
            <tr>
                <th class="px-4 py-3 text-left">Nom</th>
                <th class="px-4 py-3 text-left">Email</th>
                <th class="px-4 py-3 text-left">Téléphone</th>
                <th class="px-4 py-3 text-left">Séjours</th>
                <th class="px-4 py-3 text-left">Statut</th>
                <th class="px-4 py-3 text-left">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
            <tr *ngFor="let c of clients" class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">{{ c.name }}</td>
                <td class="px-4 py-3 text-gray-500">{{ c.email }}</td>
                <td class="px-4 py-3 text-gray-500">{{ c.phone }}</td>
                <td class="px-4 py-3">{{ c.stays }}</td>
                <td class="px-4 py-3"><span [ngClass]="c.badge" class="px-2 py-1 rounded-full text-xs">{{ c.status
                        }}</span></td>
                <td class="px-4 py-3"><button class="text-blue-600 hover:underline text-xs mr-2">Voir</button><button
                        class="text-red-500 hover:underline text-xs">Suppr.</button></td>
            </tr>
        </tbody>
    </table>
</div>
