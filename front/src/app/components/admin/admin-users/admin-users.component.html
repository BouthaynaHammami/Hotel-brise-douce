<div class="card overflow-hidden">
    <table class="w-full text-sm">
        <thead>
            <tr>
                <th class="px-4 py-3 text-left">Nom & Prénom</th>
                <th class="px-4 py-3 text-left">Email</th>
                <th class="px-4 py-3 text-left">Rôle</th>
                <th class="px-4 py-3 text-left">Date de création</th>
                <th class="px-4 py-3 text-left">Statut</th>
                <th class="px-4 py-3 text-left">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
            <tr *ngFor="let u of users" class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">{{ u.prenom }} {{ u.nom }}</td>
                <td class="px-4 py-3 text-gray-500">{{ u.email }}</td>
                <td class="px-4 py-3">
                    <span [ngClass]="getRoleBadge(u.role)" class="px-2 py-1 rounded-full text-xs">
                        {{ u.role }}
                    </span>
                </td>
                <td class="px-4 py-3 text-gray-500">{{ u.dateCreation | date:'mediumDate' }}</td>
                <td class="px-4 py-3">
                    <span class="px-2 py-1 rounded-full text-xs" [ngClass]="u.statusCompte ? 'badge-green' : 'badge-red'">
                        {{ u.statusCompte ? 'Actif' : 'Inactif' }}
                    </span>
                </td>
                <td class="px-4 py-3">
                    <button (click)="openUpdateModal(u)" class="text-blue-600 hover:underline text-xs mr-2">Modifier Rôle</button>
                    <button (click)="deleteUser(u.idUtilisateur)" class="text-red-500 hover:underline text-xs">Suppr.</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Simple inline update modal for ROLE -->
<div *ngIf="selectedUser" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);">
    <div class="card-glass rounded-2xl w-full max-w-md p-8 relative fade-in">
        <button (click)="closeUpdateModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl">✕</button>
        <div class="text-center mb-6">
            <p class="serif text-xl font-light text-navy">Modifier le Rôle de {{ selectedUser.prenom }}</p>
            <div class="gold-line w-12 mx-auto mt-2"></div>
        </div>

        <form (ngSubmit)="saveRoleUpdate()">
            <div class="mb-4">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Rôle</label>
                <select name="role" [(ngModel)]="selectedUser.role" class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm">
                    <option *ngFor="let r of RoleEnums" [value]="r">{{ r }}</option>
                </select>
            </div>

            <!-- Only show optional fields if elevating to PERSONNEL or ADMIN -->
            <div *ngIf="selectedUser.role === 'PERSONNEL' || selectedUser.role === 'ADMIN'" class="grid grid-cols-2 gap-3 mb-4 mt-4 p-4 bg-gray-50 rounded-lg">
                <div class="col-span-2">
                    <label class="block text-xs text-gray-400 tracking-widest uppercase mb-1">Détails Employé</label>
                </div>
                <div>
                    <input type="text" placeholder="Matricule" name="matricule" [(ngModel)]="selectedUser.matricule" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                    <input type="text" placeholder="Poste" name="poste" [(ngModel)]="selectedUser.poste" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                    <input type="text" placeholder="Horaires" name="horaires" [(ngModel)]="selectedUser.horaires" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
                </div>
                <div>
                    <input type="text" placeholder="Statut" name="status" [(ngModel)]="selectedUser.status" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm" />
                </div>
            </div>

            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm tracking-widest uppercase mt-4">Sauvegarder</button>
        </form>
    </div>
</div>
