<div class="flex justify-between items-center mb-6">
    <input type="date" class="border border-gray-200 rounded-lg px-4 py-2 text-sm focus:outline-none" />
    <button class="btn-primary px-4 py-2 rounded text-sm">+ Nouvelle réservation</button>
</div>
<div class="card overflow-hidden">
    <table class="w-full text-sm">
        <thead>
            <tr>
                <th class="px-4 py-3 text-left">N°</th>
                <th class="px-4 py-3 text-left">Client</th>
                <th class="px-4 py-3 text-left">Chambre</th>
                <th class="px-4 py-3 text-left">Arrivée</th>
                <th class="px-4 py-3 text-left">Départ</th>
                <th class="px-4 py-3 text-left">Montant</th>
                <th class="px-4 py-3 text-left">Statut</th>
                <th class="px-4 py-3 text-left">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
            <tr *ngFor="let r of reservations" class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">{{ r.ref }}</td>
                <td class="px-4 py-3">{{ r.client }}</td>
                <td class="px-4 py-3">{{ r.room }}</td>
                <td class="px-4 py-3">{{ r.arrival }}</td>
                <td class="px-4 py-3">{{ r.departure }}</td>
                <td class="px-4 py-3 font-medium">{{ r.amount }}</td>
                <td class="px-4 py-3"><span [ngClass]="r.badge" class="px-2 py-1 rounded-full text-xs">{{ r.status
                        }}</span></td>
                <td class="px-4 py-3"><button
                        class="text-blue-600 hover:underline text-xs mr-2">Modifier</button><button
                        class="text-red-500 hover:underline text-xs">Annuler</button></td>
            </tr>
        </tbody>
    </table>
</div>
