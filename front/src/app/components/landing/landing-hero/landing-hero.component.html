<section class="hero-bg min-h-screen flex items-center justify-center text-center px-6 py-24" style="min-height: 92vh;">
    <div class="fade-in max-w-3xl">
        <p class="text-yellow-400 tracking-widest text-xs mb-4 uppercase" style="letter-spacing: 0.3em;">Hôtel de
            Prestige</p>
        <div class="gold-line mb-6 mx-auto w-24"></div>
        <h1 class="serif text-white font-light leading-tight mb-6" style="font-size: clamp(3rem, 8vw, 5rem);">
            Brice<br /><em>Douce</em>
        </h1>
        <div class="gold-line mb-6 mx-auto w-24"></div>
        <p class="text-blue-200 text-lg font-light max-w-xl mx-auto mb-10 leading-relaxed">
            Une expérience hôtelière d'exception au cœur de la ville. Raffinement, confort et service personnalisé
            depuis 1987.
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <button (click)="openModal.emit('register')"
                class="btn-gold px-8 py-3 rounded text-sm tracking-widest uppercase">Réserver</button>
            <a href="#hotel"
                class="border border-white/40 text-white px-8 py-3 rounded text-sm tracking-widest uppercase hover:border-yellow-400 hover:text-yellow-400 transition-colors">Découvrir</a>
        </div>
    </div>
</section>
