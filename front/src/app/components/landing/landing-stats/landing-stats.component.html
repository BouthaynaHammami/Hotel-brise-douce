<section class="bg-white border-y border-gray-100 py-8">
    <div class="max-w-4xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-8 text-center px-8">
        <div *ngFor="let stat of stats">
            <p class="serif text-4xl font-light" style="color: var(--navy)">{{ stat.value }}</p>
            <p class="text-xs text-gray-500 tracking-widest uppercase mt-1">{{ stat.label }}</p>
        </div>
    </div>
</section>
