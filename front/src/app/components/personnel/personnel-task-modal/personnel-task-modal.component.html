<div class="fixed inset-0 z-50 flex items-center justify-center" style="background: rgba(0,0,0,0.5)" (click)="close()">
    <div class="bg-white rounded-2xl w-full max-w-md p-7 shadow-2xl" (click)="$event.stopPropagation()">
        <div class="flex justify-between items-center mb-5">
            <h3 class="font-semibold" style="color:var(--navy)">Mettre à jour la tâche</h3>
            <button (click)="close()" class="text-gray-400 text-xl hover:text-gray-700">✕</button>
        </div>
        <div class="bg-blue-50 rounded-xl p-4 mb-5">
            <p class="text-xs text-gray-500">Chambre</p>
            <p class="font-semibold" style="color:var(--navy)">Chambre {{ task.room }}</p>
            <p class="text-xs text-gray-500 mt-1">Type : {{ task.type }}</p>
        </div>
        <div class="mb-5">
            <label class="block text-xs text-gray-500 tracking-widest uppercase mb-3">Nouveau statut</label>
            <div class="space-y-3">
                <label
                    class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:border-yellow-400 hover:bg-yellow-50 transition-colors">
                    <input type="radio" name="status" value="attente" [(ngModel)]="selectedStatus" />
                    <span class="text-sm">⏳ En attente</span>
                </label>
                <label
                    class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors">
                    <input type="radio" name="status" value="cours" [(ngModel)]="selectedStatus" />
                    <span class="text-sm">🔄 En cours</span>
                </label>
                <label
                    class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:border-green-400 hover:bg-green-50 transition-colors">
                    <input type="radio" name="status" value="termine" [(ngModel)]="selectedStatus" />
                    <span class="text-sm">✅ Terminé</span>
                </label>
            </div>
        </div>
        <div class="mb-5">
            <label class="block text-xs text-gray-500 tracking-widest uppercase mb-2">Commentaire (optionnel)</label>
            <textarea rows="3" [(ngModel)]="comment"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm resize-none"
                placeholder="Remarques particulières, problèmes rencontrés…"></textarea>
        </div>
        <div class="flex gap-3">
            <button (click)="close()" class="flex-1 border border-gray-200 py-2.5 rounded-lg text-sm">Annuler</button>
            <button (click)="save()" class="flex-1 btn-primary rounded-lg py-2.5 text-sm">Enregistrer</button>
        </div>
    </div>
</div>

<div *ngIf="showToast" class="fixed bottom-8 right-8 bg-green-600 text-white px-6 py-4 rounded-xl shadow-2xl text-sm">
    ✓ Statut mis à jour avec succès !
</div>
