<div class="px-8 py-4 flex items-center justify-between shadow" style="background: var(--navy)">
    <div class="flex items-center gap-3 w-1/3">
        <div class="w-8 h-8 rounded-full border-2 border-yellow-400 flex items-center justify-center">
            <span class="serif text-yellow-400 font-bold text-sm">B</span>
        </div>
        <span class="serif text-white text-xl tracking-widest hidden sm:inline">BRICE DOUCE</span>
        <span class="text-blue-400 text-xs ml-2 border-l border-blue-700 pl-3 hidden md:inline">Espace Personnel</span>
    </div>
    
    <div class="flex items-center gap-4 justify-end w-2/3">
        <div *ngIf="currentUser" class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity" (click)="openProfile()" title="Mettre à jour mon profil">
            <div class="text-right hidden sm:block">
                <p class="text-white text-sm font-medium">{{ currentUser.prenom }} {{ currentUser.nom }}</p>
                <p class="text-blue-300 text-xs">{{ currentUser.poste || 'Personnel' }} {{ currentUser.horaires ? '· ' + currentUser.horaires : '' }}</p>
            </div>
            <div class="w-9 h-9 rounded-full bg-yellow-500 flex items-center justify-center text-white text-sm font-bold">
                {{ getInitials() }}
            </div>
        </div>
        <div *ngIf="!currentUser" class="text-gray-400 text-xs">Chargement...</div>

        <button (click)="logout()" class="text-blue-300 hover:text-white text-xs transition-colors ml-4 border-l border-blue-800 pl-4">Déconnexion</button>
    </div>
</div>

<app-update-profile 
    *ngIf="currentUser"
    [user]="currentUser"
    [visible]="isProfileModalVisible"
    (close)="closeProfile()"
    (profileUpdated)="onProfileUpdated($event)">
</app-update-profile>
