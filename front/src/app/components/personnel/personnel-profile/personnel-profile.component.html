<h2 class="serif text-3xl font-light mb-6" style="color:var(--navy)">Mon profil</h2>
<div class="grid md:grid-cols-3 gap-6">
    <!-- Avatar card -->
    <div class="card p-6 text-center">
        <div
            class="w-20 h-20 rounded-full bg-yellow-500 flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4">
            FO</div>
        <h3 class="font-semibold" style="color:var(--navy)">Fatima Oueldi</h3>
        <p class="text-gray-500 text-sm mt-1">Femme de chambre</p>
        <p class="text-xs text-gray-400 mt-1">Service du Matin · 6h–14h</p>
        <div class="mt-4 pt-4 border-t border-gray-100">
            <p class="text-xs text-gray-500">Membre depuis</p>
            <p class="text-sm font-medium" style="color:var(--navy)">Janvier 2022</p>
        </div>
    </div>
    <!-- Info card -->
    <div class="md:col-span-2 card p-6">
        <h4 class="font-semibold text-sm mb-5" style="color:var(--navy)">Informations personnelles</h4>
        <div class="grid md:grid-cols-2 gap-4 text-sm mb-6">
            <div>
                <label class="block text-xs text-gray-500 tracking-wider uppercase mb-1">Prénom</label>
                <input value="Fatima" class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50" readonly />
            </div>
            <div>
                <label class="block text-xs text-gray-500 tracking-wider uppercase mb-1">Nom</label>
                <input value="Oueldi" class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50" readonly />
            </div>
            <div>
                <label class="block text-xs text-gray-500 tracking-wider uppercase mb-1">Email</label>
                <input value="f.oueldi@bricedouce.fr"
                    class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50" readonly />
            </div>
            <div>
                <label class="block text-xs text-gray-500 tracking-wider uppercase mb-1">Téléphone</label>
                <input [(ngModel)]="phone" class="w-full border border-gray-200 rounded-lg px-3 py-2" />
            </div>
        </div>
        <h4 class="font-semibold text-sm mb-4" style="color:var(--navy)">Changer le mot de passe</h4>
        <div class="grid md:grid-cols-2 gap-4 text-sm mb-5">
            <div>
                <label class="block text-xs text-gray-500 tracking-wider uppercase mb-1">Nouveau mot de passe</label>
                <input type="password" [(ngModel)]="newPassword" placeholder="••••••••"
                    class="w-full border border-gray-200 rounded-lg px-3 py-2" />
            </div>
            <div>
                <label class="block text-xs text-gray-500 tracking-wider uppercase mb-1">Confirmer</label>
                <input type="password" [(ngModel)]="confirmPassword" placeholder="••••••••"
                    class="w-full border border-gray-200 rounded-lg px-3 py-2" />
            </div>
        </div>
        <div class="flex justify-end">
            <button (click)="save()" class="btn-primary px-6 py-2 rounded-lg text-sm">Enregistrer les
                modifications</button>
        </div>
    </div>
</div>

<!-- Stats personnelles -->
<div class="grid grid-cols-3 gap-4 mt-6">
    <div *ngFor="let s of stats" class="card p-5 text-center">
        <p class="serif text-3xl font-light" [ngClass]="s.color" [style]="s.style">{{ s.value }}</p>
        <p class="text-xs text-gray-500 mt-1">{{ s.label }}</p>
    </div>
</div>
