<h2 class="serif text-3xl font-light mb-2" style="color:var(--navy)">Faire une réclamation</h2>
<p class="text-gray-500 text-sm mb-6">Votre satisfaction est notre priorité.</p>
<div class="grid md:grid-cols-3 gap-6">
    <div class="md:col-span-2 card p-7">
        <div class="grid md:grid-cols-2 gap-5 mb-5">
            <div>
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-2">Réservation concernée</label>
                <select class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all">
                    <option>#1042 — Chambre 204 (actuelle)</option>
                    <option>#1055 — Suite 301</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-2">Catégorie</label>
                <select class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all">
                    <option>Chambre & équipements</option>
                    <option>Service & personnel</option>
                    <option>Restauration</option>
                    <option>Nuisances sonores</option>
                    <option>Facturation</option>
                    <option>Autre</option>
                </select>
            </div>
        </div>
        <div class="mb-5">
            <label class="block text-xs text-gray-500 tracking-widest uppercase mb-2">Objet</label>
            <input type="text" placeholder="Résumez votre problème…"
                class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
        </div>
        <div class="mb-5">
            <label class="block text-xs text-gray-500 tracking-widest uppercase mb-2">Description</label>
            <textarea rows="5"
                class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm resize-none transition-all"
                placeholder="Décrivez le problème avec le plus de détails possible…"></textarea>
        </div>
        <div class="mb-5">
            <label class="block text-xs text-gray-500 tracking-widest uppercase mb-2">Priorité</label>
            <div class="flex gap-3">
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="priorite"
                        value="normale" checked /><span class="text-sm">Normale</span></label>
                <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="priorite"
                        value="urgente" /><span class="text-sm text-red-600">Urgente</span></label>
            </div>
        </div>
        <button (click)="submit()" class="btn-primary w-full py-3 rounded-lg text-sm tracking-wider">Soumettre la
            réclamation</button>
    </div>
    <div class="space-y-4">
        <div class="card p-5">
            <h4 class="font-semibold text-sm mb-3" style="color:var(--navy)">Mes réclamations</h4>
            <div class="space-y-3">
                <div *ngFor="let c of myComplaints" class="p-3 rounded-lg bg-gray-50">
                    <div class="flex justify-between items-start">
                        <p class="text-xs font-medium text-gray-700">{{ c.subject }}</p>
                        <span [ngClass]="c.badge" class="px-1.5 py-0.5 rounded text-xs">{{ c.status }}</span>
                    </div>
                    <p class="text-xs text-gray-400 mt-1">{{ c.date }}</p>
                </div>
            </div>
        </div>
        <div class="card p-5">
            <h4 class="font-semibold text-sm mb-2" style="color:var(--navy)">Besoin d'aide immédiate ?</h4>
            <p class="text-xs text-gray-500 mb-3">La réception est disponible 24h/24.</p>
            <p class="text-sm font-medium" style="color:var(--navy)">📞 Poste 0</p>
        </div>
    </div>
</div>
<div *ngIf="showToast" class="fixed bottom-8 right-8 bg-green-600 text-white px-6 py-4 rounded-xl shadow-2xl text-sm">
    ✓ Réclamation soumise ! Notre équipe vous contactera sous 2h.
</div>
