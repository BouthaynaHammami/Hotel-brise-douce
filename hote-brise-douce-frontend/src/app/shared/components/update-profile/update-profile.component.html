<div *ngIf="visible && user" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);">
    <div class="card-glass rounded-2xl w-full max-w-md p-8 relative fade-in">
        <button (click)="onClose()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl">✕</button>
        <div class="text-center mb-6">
            <p class="serif text-xl font-light text-navy">Mettre à jour mon profil</p>
            <div class="gold-line w-12 mx-auto mt-2"></div>
        </div>

        <div *ngIf="errorMessage" class="mb-4 text-center text-red-500 text-sm">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSaveProfile()">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Prénom</label>
                    <input type="text" placeholder="Jean" name="prenom" [(ngModel)]="profileData.prenom" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-3 text-sm transition-all" />
                </div>
                <div>
                    <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Nom</label>
                    <input type="text" placeholder="Dupont" name="nom" [(ngModel)]="profileData.nom" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-3 text-sm transition-all" />
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Téléphone</label>
                <input type="tel" placeholder="+33 6 00 00 00 00" name="telephone" [(ngModel)]="profileData.telephone" required
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
            </div>

            <!-- Only for Clients usually, but we keep it optional as requested -->
            <div class="mb-4">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Allergies ou Préférences</label>
                <input type="text" placeholder="Ex: Arachide, Végétarien..." name="allergies" [(ngModel)]="profileData.allergies" 
                    class="w-full border border-gray-200 rounded-lg px-3 py-3 text-sm transition-all" />
            </div>

            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm tracking-widest uppercase mt-4">Enregistrer les modifications</button>
        </form>
    </div>
</div>
