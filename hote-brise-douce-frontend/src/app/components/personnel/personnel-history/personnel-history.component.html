<h2 class="serif text-3xl font-light mb-6" style="color:var(--navy)">Historique des tâches</h2>
<div class="card overflow-hidden">
    <table class="w-full text-sm">
        <thead>
            <tr style="background:var(--navy)">
                <th class="px-4 py-3 text-left text-white font-medium text-xs tracking-wider">Chambre</th>
                <th class="px-4 py-3 text-left text-white font-medium text-xs tracking-wider">Type</th>
                <th class="px-4 py-3 text-left text-white font-medium text-xs tracking-wider">Date</th>
                <th class="px-4 py-3 text-left text-white font-medium text-xs tracking-wider">Durée</th>
                <th class="px-4 py-3 text-left text-white font-medium text-xs tracking-wider">Statut</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-50">
            <tr *ngFor="let e of entries" class="hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">{{ e.room }}</td>
                <td class="px-4 py-3 text-gray-500">{{ e.type }}</td>
                <td class="px-4 py-3 text-gray-500">{{ e.date }}</td>
                <td class="px-4 py-3">{{ e.duration }}</td>
                <td class="px-4 py-3"><span class="badge-green px-2 py-1 rounded-full text-xs">Terminé</span></td>
            </tr>
        </tbody>
    </table>
</div>
