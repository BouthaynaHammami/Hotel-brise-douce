<div class="grid grid-cols-2 md:grid-cols-4 gap-5 mb-8">
    <div *ngFor="let s of stats" class="card stat-card p-5">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">{{ s.label }}</p>
        <p class="serif text-3xl font-light" [style.color]="s.color">{{ s.value }}<span *ngIf="s.suffix"
                class="text-lg text-gray-400">{{ s.suffix }}</span></p>
    </div>
</div>
<div class="grid md:grid-cols-2 gap-6">
    <div class="card p-6">
        <h3 class="font-medium text-gray-700 mb-4">Activité récente</h3>
        <div class="space-y-3">
            <div *ngFor="let a of activities" class="flex items-center gap-3 text-sm">
                <span class="w-2 h-2 rounded-full" [ngClass]="a.color"></span>
                <span class="text-gray-600">{{ a.text }}</span>
                <span class="ml-auto text-gray-400 text-xs">{{ a.time }}</span>
            </div>
        </div>
    </div>
    <div class="card p-6">
        <h3 class="font-medium text-gray-700 mb-4">État des chambres</h3>
        <div class="space-y-3">
            <div *ngFor="let r of roomStates" class="flex justify-between items-center text-sm">
                <span>{{ r.label }}</span>
                <div class="flex items-center gap-2">
                    <div class="w-32 h-2 rounded-full bg-gray-100 overflow-hidden">
                        <div class="h-full rounded-full" [ngClass]="r.color" [style.width]="r.pct + '%'"></div>
                    </div>
                    <span class="font-medium">{{ r.count }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
