<div class="flex" style="background:#f0f4ff; min-height:100vh;">
    <app-admin-sidebar (sectionChange)="onSectionChange($event)"></app-admin-sidebar>
    <main class="flex-1 p-8" style="margin-left: 240px;">
        <app-admin-header [title]="title"></app-admin-header>

        <app-admin-dashboard *ngIf="activeSection === 'dashboard'"></app-admin-dashboard>
        <app-admin-clients *ngIf="activeSection === 'clients'"></app-admin-clients>
        <app-admin-rooms *ngIf="activeSection === 'chambres'"></app-admin-rooms>
        <app-admin-reservations *ngIf="activeSection === 'reservations'"></app-admin-reservations>
        <app-admin-cleaning *ngIf="activeSection === 'nettoyage'"></app-admin-cleaning>
        <app-admin-personnel *ngIf="activeSection === 'personnel'"></app-admin-personnel>
        <app-admin-complaints *ngIf="activeSection === 'reclamations'"></app-admin-complaints>
        <app-admin-users *ngIf="activeSection === 'utilisateurs'"></app-admin-users>
    </main>
</div>
