<section id="services" class="py-24 px-8" style="background: var(--navy)">
    <div class="max-w-5xl mx-auto text-center">
        <p class="text-xs tracking-widest uppercase mb-3 text-yellow-400" style="letter-spacing:0.3em;">Nos Prestations
        </p>
        <h2 class="serif text-4xl font-light text-white mb-4">Services Exclusifs</h2>
        <div class="gold-line w-16 mx-auto mb-12"></div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-8">
            <div *ngFor="let s of services" class="text-center">
                <div class="text-4xl mb-3">{{ s.icon }}</div>
                <p class="text-white text-sm">{{ s.name }}</p>
                <p class="text-blue-300 text-xs mt-1">{{ s.hours }}</p>
            </div>
        </div>
    </div>
</section>
