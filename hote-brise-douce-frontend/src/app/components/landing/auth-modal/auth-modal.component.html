<div *ngIf="visible" class="modal-backdrop fixed inset-0 z-50 flex items-center justify-center p-4"
    style="background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);" (click)="onBackdropClick($event)">
    <div class="card-glass rounded-2xl w-full max-w-md p-8 relative fade-in">
        <button (click)="close()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-xl">✕</button>
        <div class="text-center mb-6">
            <p class="serif text-2xl font-light" style="color:var(--navy)">Brice Douce</p>
            <div class="gold-line w-12 mx-auto mt-2"></div>
        </div>
        <!-- TABS -->
        <div class="flex border-b border-gray-200 mb-6">
            <button (click)="switchTab('login')" class="flex-1 py-2 text-sm transition-all"
                [class.tab-active]="activeTab === 'login'"
                [class.tab-inactive]="activeTab !== 'login'">Connexion</button>
            <button (click)="switchTab('register')" class="flex-1 py-2 text-sm transition-all"
                [class.tab-active]="activeTab === 'register'" [class.tab-inactive]="activeTab !== 'register'">Créer un
                compte</button>
        </div>

        <div *ngIf="errorMessage" class="mb-4 text-center text-red-500 text-sm">
            {{ errorMessage }}
        </div>

        <!-- LOGIN FORM -->
        <form *ngIf="activeTab === 'login'" (ngSubmit)="onSubmitLogin()">
            <div class="mb-4">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Email</label>
                <input type="email" placeholder="votre@email.fr" name="username" [(ngModel)]="loginData.username" required
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
            </div>
            <div class="mb-6">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Mot de passe</label>
                <input type="password" placeholder="••••••••" name="password" [(ngModel)]="loginData.password" required
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
            </div>
            <button type="submit" class="btn-primary w-full py-3 rounded-lg text-sm tracking-widest uppercase">Se connecter</button>
            <p class="text-center text-xs text-gray-400 mt-4 cursor-pointer hover:text-gray-600">Mot de passe oublié ?
            </p>
        </form>

        <!-- REGISTER FORM -->
        <form *ngIf="activeTab === 'register'" (ngSubmit)="onSubmitRegister()">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div>
                    <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Prénom</label>
                    <input type="text" placeholder="Jean" name="prenom" [(ngModel)]="registerData.prenom" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-3 text-sm transition-all" />
                </div>
                <div>
                    <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Nom</label>
                    <input type="text" placeholder="Dupont" name="nom" [(ngModel)]="registerData.nom" required
                        class="w-full border border-gray-200 rounded-lg px-3 py-3 text-sm transition-all" />
                </div>
            </div>
            <div class="mb-3">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Email</label>
                <input type="email" placeholder="votre@email.fr" name="email" [(ngModel)]="registerData.email" required
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
            </div>
            <div class="mb-3">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Téléphone</label>
                <input type="tel" placeholder="+33 6 00 00 00 00" name="telephone" [(ngModel)]="registerData.telephone" required
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
            </div>
            <div class="mb-6">
                <label class="block text-xs text-gray-500 tracking-widest uppercase mb-1">Mot de passe</label>
                <input type="password" placeholder="••••••••" name="motDePasse" [(ngModel)]="registerData.motDePasse" required
                    class="w-full border border-gray-200 rounded-lg px-4 py-3 text-sm transition-all" />
            </div>
            <button type="submit" class="btn-gold w-full py-3 rounded-lg text-sm tracking-widest uppercase">Créer mon compte</button>
        </form>
    </div>
</div>
