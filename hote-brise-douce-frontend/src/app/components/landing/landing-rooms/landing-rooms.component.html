<section id="chambres" class="py-24 px-8" style="background: linear-gradient(180deg, #f5f2eb, white)">
    <div class="max-w-6xl mx-auto">
        <div class="text-center mb-16">
            <p class="text-xs tracking-widest uppercase mb-3" style="color:var(--gold); letter-spacing:0.3em;">Nos
                Hébergements</p>
            <h2 class="serif text-4xl font-light" style="color:var(--navy)">Chambres & Suites</h2>
            <div class="gold-line w-16 mx-auto mt-4"></div>
        </div>
        <div class="grid md:grid-cols-3 gap-8">
            <div *ngFor="let room of rooms"
                class="room-card rounded-lg overflow-hidden shadow-lg relative cursor-pointer">
                <div class="h-52 flex items-center justify-center relative" [style.background]="room.gradient">
                    <span class="serif text-white absolute" style="font-size:3.75rem; opacity:0.2;">{{ room.roman
                        }}</span>
                    <div class="text-center text-white z-10">
                        <div class="text-4xl mb-2">{{ room.icon }}</div>
                        <p class="text-sm tracking-widest">{{ room.type }}</p>
                    </div>
                    <div class="room-overlay absolute inset-0 bg-black/50 flex items-center justify-center">
                        <button (click)="openModal.emit('register')"
                            class="btn-gold px-5 py-2 rounded text-sm">Réserver</button>
                    </div>
                </div>
                <div class="bg-white p-6">
                    <h3 class="serif text-xl font-light mb-1" style="color:var(--navy)">{{ room.name }}</h3>
                    <p class="text-xs text-gray-500 mb-3">{{ room.details }}</p>
                    <p class="text-gray-600 text-sm mb-4">{{ room.description }}</p>
                    <div class="flex justify-between items-center">
                        <span class="serif text-2xl" style="color:var(--gold)">{{ room.price }}€<span
                                class="text-sm text-gray-400">/nuit</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
