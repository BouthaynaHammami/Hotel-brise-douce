# ===================================================================
# Configuration pour le microservice : api-gateway
# Centralisée dans le Config Server (Mode Native)
# ===================================================================

# --- Serveur ---
server.port=8081

# --- Discovery ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost

# --- Keycloak OAuth2 Resource Server ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/hotel-brise-douce
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/hotel-brise-douce/protocol/openid-connect/certs
