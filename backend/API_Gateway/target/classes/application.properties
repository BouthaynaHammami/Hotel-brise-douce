spring.application.name=api-gateway
server.port=8081

spring.cloud.discovery.enabled=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=localhost
spring.cloud.config.enabled=false

# =============================================
# Keycloak - OAuth2 Resource Server (JWT)
# =============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/hotel-brise-douce
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/hotel-brise-douce/protocol/openid-connect/certs

spring.cloud.loadbalancer.eureka.enabled=true
spring.cloud.loadbalancer.cache.enabled=false

# Deduping Response Headers to prevent browser errors with multiple values
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_UNIQUE
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Headers Access-Control-Allow-Methods RETAIN_UNIQUE


logging.level.org.springframework.cloud.gateway=TRACE
logging.level.reactor.netty.http.client=DEBUG

spring.cloud.gateway.routes[0].id=avis_reclamations_service
spring.cloud.gateway.routes[0].uri=lb://AVIS_RECLAMATIONS_SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/avis_reclamations/api/**

spring.cloud.gateway.routes[1].id=chambres_service
spring.cloud.gateway.routes[1].uri=lb://CHAMBRES_SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/chambres/api/**

spring.cloud.gateway.routes[2].id=clients_service
spring.cloud.gateway.routes[2].uri=lb://CLIENTS_SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/clients/api/**

spring.cloud.gateway.routes[3].id=nettoyage_maintenance_service
spring.cloud.gateway.routes[3].uri=lb://NETTOYAGE_MAINTENANCE_SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/nettoyage_maintenance/api/**

spring.cloud.gateway.routes[4].id=personnel_service
spring.cloud.gateway.routes[4].uri=http://localhost:8086
spring.cloud.gateway.routes[4].predicates[0]=Path=/personnel/api/**

spring.cloud.gateway.routes[5].id=reservations_service
spring.cloud.gateway.routes[5].uri=lb://RESERVATIONS_SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/reservations/api/**

spring.cloud.gateway.routes[6].id=utilisateurs_service
spring.cloud.gateway.routes[6].uri=http://localhost:8000
spring.cloud.gateway.routes[6].predicates[0]=Path=/utilisateurs/api/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/utilisateurs/api/(?<segment>.*), /${segment}